<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pillbox — medication tracker</title>
<meta name="description" content="Track your daily medications with a simple checklist and calendar. All data stays on your device.">
<meta name="theme-color" content="#234A43">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pillbox">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1C2622;
    --ink-soft: #4B564F;
    --paper: #F5F3EC;
    --panel: #FFFFFF;
    --line: #DAD6C8;
    --teal: #234A43;
    --teal-soft: #E4EDE8;
    --amber: #C4771C;
    --amber-soft: #F6E6CF;
    --miss: #B4523F;
    --miss-soft: #F5E2DD;
    --radius-s: 6px;
    --radius-m: 10px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header.app-head{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .head-right{
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .today-line{
    font-size: 0.95rem;
    color: var(--ink-soft);
  }

  .install-btn{
    font-family: inherit;
    font-weight: 600;
    font-size: 0.82rem;
    background: var(--panel);
    color: var(--teal);
    border: 1px solid var(--teal);
    border-radius: var(--radius-s);
    padding: 7px 12px;
    cursor: pointer;
  }
  .install-btn:hover{ background: var(--teal-soft); }

  section{ margin-bottom: 44px; }

  h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
  }

  /* --- Today panel --- */
  .today-list{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pill-row{
    display:flex;
    align-items:center;
    gap: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 14px 18px;
  }

  .pill-row.taken{
    background: var(--teal-soft);
    border-color: #C6DAD1;
  }

  .check-btn{
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--teal);
    background: transparent;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    padding: 0;
  }

  .check-btn.checked{
    background: var(--teal);
  }

  .check-btn.checked::after{
    content: "";
    position: absolute;
    left: 8px; top: 3px;
    width: 6px; height: 12px;
    border: solid var(--panel);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .pill-info{ flex: 1; min-width: 0; }
  .pill-name{ font-weight: 600; font-size: 1rem; }
  .pill-meta{ font-size: 0.85rem; color: var(--ink-soft); margin-top: 2px; }

  .pill-time{
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .del-btn{
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 4px;
    opacity: 0.5;
  }
  .del-btn:hover{ opacity: 1; color: var(--miss); }

  .empty-note{
    color: var(--ink-soft);
    font-size: 0.92rem;
    font-style: italic;
    padding: 18px 0;
  }

  /* --- Add form --- */
  .add-form{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 16px;
  }

  .add-form input{
    font-family: inherit;
    font-size: 0.92rem;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-s);
    background: var(--paper);
    color: var(--ink);
  }
  .add-form input:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }

  #med-name{ flex: 2; min-width: 160px; }
  #med-dosage{ flex: 1; min-width: 100px; }
  #med-time{ flex: 0 0 auto; width: 130px; }

  .add-btn{
    font-family: inherit;
    font-weight: 600;
    font-size: 0.92rem;
    background: var(--teal);
    color: var(--panel);
    border: none;
    border-radius: var(--radius-s);
    padding: 10px 18px;
    cursor: pointer;
  }
  .add-btn:hover{ background: #1a3831; }

  /* --- Calendar --- */
  .cal-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-head h2{ margin: 0; }
  .cal-nav{ display:flex; gap: 6px; align-items:center; }
  .cal-nav button{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-s);
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 1rem;
    color: var(--ink);
  }
  .cal-nav button:hover{ background: var(--teal-soft); }
  .cal-month-label{
    font-size: 0.92rem;
    color: var(--ink-soft);
    min-width: 130px;
    text-align: center;
  }

  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .cal-dow{
    text-align: center;
    font-size: 0.72rem;
    color: var(--ink-soft);
    padding-bottom: 4px;
  }

  .cal-cell{
    aspect-ratio: 1;
    border-radius: var(--radius-s);
    border: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    color: var(--ink-soft);
    cursor: default;
    position: relative;
  }

  .cal-cell.blank{ border: none; background: none; }

  .cal-cell.full{ background: var(--teal-soft); border-color: #C6DAD1; }
  .cal-cell.partial{ background: var(--amber-soft); border-color: #E8CFA0; }
  .cal-cell.missed{ background: var(--miss-soft); border-color: #E9C4BA; }

  .cal-cell.today{ box-shadow: inset 0 0 0 2px var(--teal); }

  .cal-dot{
    width: 5px; height: 5px;
    border-radius: 50%;
    margin-top: 3px;
    background: var(--ink-soft);
  }
  .cal-cell.full .cal-dot{ background: var(--teal); }
  .cal-cell.partial .cal-dot{ background: var(--amber); }
  .cal-cell.missed .cal-dot{ background: var(--miss); }

  .legend{
    display: flex;
    gap: 18px;
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }
  .legend span{ display:flex; align-items:center; gap: 6px; }
  .swatch{ width: 10px; height: 10px; border-radius: 3px; }
  .swatch.full{ background: var(--teal); }
  .swatch.partial{ background: var(--amber); }
  .swatch.missed{ background: var(--miss); }

  footer{
    font-size: 0.8rem;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 18px;
    margin-top: 8px;
  }

  @media (prefers-reduced-motion: no-preference){
    .pill-row, .cal-cell{ transition: background 0.15s ease, border-color 0.15s ease; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="app-head">
    <h1>Pillbox</h1>
    <div class="head-right">
      <div class="today-line" id="today-line"></div>
      <button id="install-btn" class="install-btn" hidden>Install app</button>
    </div>
  </header>

  <section id="today-section">
    <h2>Today</h2>
    <div class="today-list" id="today-list"></div>
  </section>

  <section>
    <h2>Add a medication</h2>
    <div class="add-form">
      <input type="text" id="med-name" placeholder="Name (e.g. Vitamin D)" />
      <input type="text" id="med-dosage" placeholder="Dosage (e.g. 1000 IU)" />
      <input type="time" id="med-time" value="09:00" />
      <button class="add-btn" id="add-btn">Add</button>
    </div>
  </section>

  <section>
    <div class="cal-head">
      <h2>History</h2>
      <div class="cal-nav">
        <button id="prev-month" aria-label="Previous month">‹</button>
        <div class="cal-month-label" id="month-label"></div>
        <button id="next-month" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="legend">
      <span><span class="swatch full"></span> All taken</span>
      <span><span class="swatch partial"></span> Some taken</span>
      <span><span class="swatch missed"></span> None taken</span>
    </div>
  </section>

  <footer>
    Everything here is stored only in this browser, on this device. Nothing is sent anywhere.
  </footer>

</div>

<script>
(function(){
  const STORAGE_KEY = "pillbox-data-v1";

  function todayStr(d){
    d = d || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { meds: [], logs: {} };
      const parsed = JSON.parse(raw);
      return { meds: parsed.meds || [], logs: parsed.logs || {} };
    }catch(e){
      console.error("Pillbox: failed to read local storage", e);
      return { meds: [], logs: {} };
    }
  }

  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }catch(e){
      console.error("Pillbox: failed to save to local storage", e);
    }
  }

  let data = loadData();
  let calCursor = new Date(); // month currently displayed
  calCursor.setDate(1);

  function uid(){
    return 'm' + Math.random().toString(36).slice(2,9);
  }

  // ---------- Today rendering ----------
  function renderToday(){
    const list = document.getElementById('today-list');
    const dateKey = todayStr();
    document.getElementById('today-line').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

    list.innerHTML = '';
    if(data.meds.length === 0){
      const p = document.createElement('div');
      p.className = 'empty-note';
      p.textContent = 'No medications added yet. Add one below to start tracking.';
      list.appendChild(p);
      return;
    }

    const sorted = [...data.meds].sort((a,b) => a.time.localeCompare(b.time));
    const dayLog = data.logs[dateKey] || {};

    sorted.forEach(med => {
      const taken = !!dayLog[med.id];
      const row = document.createElement('div');
      row.className = 'pill-row' + (taken ? ' taken' : '');

      const btn = document.createElement('button');
      btn.className = 'check-btn' + (taken ? ' checked' : '');
      btn.setAttribute('aria-label', taken ? `Mark ${med.name} as not taken` : `Mark ${med.name} as taken`);
      btn.onclick = () => {
        if(!data.logs[dateKey]) data.logs[dateKey] = {};
        data.logs[dateKey][med.id] = !data.logs[dateKey][med.id];
        if(!data.logs[dateKey][med.id]) delete data.logs[dateKey][med.id];
        saveData();
        renderToday();
        renderCalendar();
      };

      const info = document.createElement('div');
      info.className = 'pill-info';
      const name = document.createElement('div');
      name.className = 'pill-name';
      name.textContent = med.name;
      const meta = document.createElement('div');
      meta.className = 'pill-meta';
      meta.textContent = med.dosage || 'No dosage noted';
      info.appendChild(name);
      info.appendChild(meta);

      const time = document.createElement('div');
      time.className = 'pill-time';
      time.textContent = formatTime(med.time);

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.setAttribute('aria-label', `Remove ${med.name}`);
      del.textContent = '✕';
      del.onclick = () => {
        if(confirm(`Remove ${med.name} from your list? Past history will be kept.`)){
          data.meds = data.meds.filter(m => m.id !== med.id);
          saveData();
          renderToday();
        }
      };

      row.appendChild(btn);
      row.appendChild(info);
      row.appendChild(time);
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function formatTime(t){
    const [h,m] = t.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12}:${String(m).padStart(2,'0')} ${period}`;
  }

  // ---------- Add form ----------
  document.getElementById('add-btn').addEventListener('click', () => {
    const nameEl = document.getElementById('med-name');
    const doseEl = document.getElementById('med-dosage');
    const timeEl = document.getElementById('med-time');

    const name = nameEl.value.trim();
    if(!name){
      nameEl.focus();
      return;
    }
    const dosage = doseEl.value.trim();
    const time = timeEl.value || '09:00';

    data.meds.push({ id: uid(), name, dosage, time });
    saveData();

    nameEl.value = '';
    doseEl.value = '';
    timeEl.value = '09:00';
    nameEl.focus();

    renderToday();
  });

  // ---------- Calendar rendering ----------
  const DOW = ['S','M','T','W','T','F','S'];

  function renderCalendar(){
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    const year = calCursor.getFullYear();
    const month = calCursor.getMonth();

    document.getElementById('month-label').textContent =
      calCursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    DOW.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayKey = todayStr();

    for(let i = 0; i < startOffset; i++){
      const blank = document.createElement('div');
      blank.className = 'cal-cell blank';
      grid.appendChild(blank);
    }

    for(let d = 1; d <= daysInMonth; d++){
      const dateObj = new Date(year, month, d);
      const key = todayStr(dateObj);
      const cell = document.createElement('div');
      cell.className = 'cal-cell';

      const activeMedsThatDay = data.meds; // simple model: all current meds apply daily
      const dayLog = data.logs[key] || {};
      const takenCount = Object.keys(dayLog).filter(id => dayLog[id]).length;

      if(key === todayKey) cell.classList.add('today');

      if(dateObj <= new Date() ){
        if(activeMedsThatDay.length > 0){
          if(takenCount === 0){
            cell.classList.add('missed');
          } else if(takenCount >= activeMedsThatDay.length){
            cell.classList.add('full');
          } else {
            cell.classList.add('partial');
          }
        }
      }

      const num = document.createElement('div');
      num.textContent = d;
      cell.appendChild(num);

      if(activeMedsThatDay.length > 0 && dateObj <= new Date()){
        const dot = document.createElement('div');
        dot.className = 'cal-dot';
        cell.appendChild(dot);
      }

      cell.title = activeMedsThatDay.length
        ? `${takenCount} of ${activeMedsThatDay.length} marked taken`
        : 'No medications tracked';

      grid.appendChild(cell);
    }
  }

  document.getElementById('prev-month').addEventListener('click', () => {
    calCursor.setMonth(calCursor.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    calCursor.setMonth(calCursor.getMonth() + 1);
    renderCalendar();
  });

  renderToday();
  renderCalendar();

  // ---------- PWA: install prompt ----------
  let deferredPrompt = null;
  const installBtn = document.getElementById('install-btn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener('click', async () => {
    if(!deferredPrompt) return;
    installBtn.hidden = true;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  });

  window.addEventListener('appinstalled', () => {
    installBtn.hidden = true;
    deferredPrompt = null;
  });

  // ---------- PWA: service worker ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.error('Pillbox: service worker registration failed', err);
      });
    });
  }
})();
</script>

</body>
</html>
